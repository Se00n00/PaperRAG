<div class="relative translate-y-7 shadow-md shadow-black/[0.1] bg-white backdrop-blur-md rounded-2xl border border-black/[0.1] w-[80vw] sm:w-[60vw] lg:w-[40vw]">

    <div class="h-15 m-[2px] border flex flex-col rounded-2xl font-semibold"
    [ngClass]="{
        'border-black/[0.3] bg-black/[0.2] text-black':type == 'USER',
        'border-blue-300/[0.3] bg-blue-300/[0.2] text-blue-400':type == 'ASSISTANT',
        'border-red-300/[0.3] bg-red-200/[0.2] text-red-400':type == 'SYSTEM',
    }">      
        <div class="flex items-center gap-1 text-xs p-2">
            <img
            [src]="
                type === 'SYSTEM' ? 'icon/alert.svg' : 
                type === 'USER' ? 'icon/usermessage.svg' : 
                type === 'ASSISTANT' ? 'icon/frameblue.svg' : ''
            " class="h-4 opacity-50">
            {{type}}
        </div>
        
        
    </div>
    

</div>
<div class="relative z-10 shadow-md shadow-black/[0.2] rounded-2xl w-[80vw] sm:w-[60vw] lg:w-[40vw]">
    <div class=" flex flex-col gap-1 border-black/[0.1] border bg-white rounded-2xl text-sm p-3">
        <markdown [data]="heading" class="text-sm text-black font-semibold"></markdown>
        <markdown [data]="message" class="text-sm text-black/[0.7]"></markdown>
    </div>
</div>
