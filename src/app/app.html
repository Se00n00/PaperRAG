<div class="relative flex-1  h-full shadow-md border border-black/[0.4] bg-white  flex flex-col p-1 items-center rounded-xl max-h-screen overflow-scroll"
  [ngClass]="{
    '':scholarPapers().length === 0,
    'items-center':scholarPapers().length > 0
  }">
  <div class="fixed z-10 bottom-5 left-5">
    
    @if(auth.sessions && auth.sessions.user.is_anonymous){
      <div (click)="auth.sign_in_oauth()" class="backdrop-blur-md  flex items-center py-1 px-1.5 pr-3 gap-2 group bg-black/[0.1] shadow rounded-2xl text-xs font-light text-black/[0.7] cursor-pointer hover:bg-black/[0.2] hover:scale-[1.08] transition-all hover:shadow-xl">
        <img src="icon/ghost.svg" alt="sign In" class="opacity-70 h-6 hover:scale-[0.96] transition-all hover:opacity-85" title="No User Found">
        Sign In
      </div>
    }@else {
      <div (click)="auth.sign_out()" class="backdrop-blur-md  flex items-center py-1 px-1.5 pr-3 gap-2 group bg-black/[0.1] shadow rounded-2xl text-xs font-light text-black/[0.7] cursor-pointer hover:bg-black/[0.2] hover:scale-[1.08] transition-all hover:shadow-xl">
        <img [src]="auth.data()?.user.user_metadata.avatar_url" alt="user" class="rounded-full h-6 hover:scale-[0.96] transition-all hover:opacity-85" title="No User Found">
        Sign Out
      </div>
    }
    
    
  </div>

  <!-- SHOW CONVERSTAION WITH RAG BACKEND  -->
  @if(isSearched()){
    <div class="flex flex-col items-center">
      @for (item of message2Component(); track $index) {
        <app-ai-output [type]="item.type" [heading]="item.heading" [message]="item.content" class=""/>
      }
      <div #bottom class="h-80"></div>
    </div>
  }

  <!-- ================================SEARCH LIST OF PAPERS: STARTS HERE=================================  -->
  <div class="flex-1 flex flex-col gap-5 items-center"
  [ngClass]="{
    '': isSearched(),
    'justify-center': !isSearched()
  }">

    <!-- SHOW SEARCHED LIST OF PAPERS  -->
    @if(currentPaper && !isSearched()){
      <app-papers (startConversation)="newConversation($event)" [scholarPapers]="scholarPapers()" [currentPaper]="currentPaper"/>
    }

    <!-- SEARCH FOR PAPERS  -->
    <div class="relative bg-black/[0.05] backdrop-blur-md rounded-2xl p-1.5"
    [ngClass]="{
      'relative':scholarPapers().length === 0,
      'fixed bottom-5':scholarPapers().length > 0
    }">

      <div class="flex flex-col justify-between w-[80vw] sm:w-[60vw] lg:w-[40vw] gap-1">
        <div class="flex justify-between items-center">
          <div>
            <!-- @if (isSearched()) {
              <div (click)="newSession()" class="px-2 text-xs font-light hover:text-blue-600 cursor-pointer">
                @Create New
              </div>
            } -->
            <div class="select-none text-xs border-black/[0.2] border bg-black/[0.6] text-white ml-1 px-1.5 py-1 rounded-lg shadow-md">
              {{isSearched()?'@Ask Questions':'@Search Pdfs'}}
            </div>
            
            
          </div>
          
          <div class="flex items-center gap-2">
            @if (searchlinkInput()) {
              <input 
              [ngModel]="searchlink()"
              (ngModelChange)="onSearchLinkChange($event)"
              type="text" class="text-black/[0.6] h-7 focus:outline-none hadow-xl border border-black/[0.1] shadow-black/[0.1] bg-white font-light text-xs p-1.5 px-3 rounded-xl  transition-all" placeholder="Paste the link of paper" >  
            }
            <!-- <div (click)="seachUsingLink()" class="cursor-pointer shadow-xl border border-black/[0.1] shadow-black/[0.1] hover:shadow-black/[0.2] bg-white font-light text-xs p-1.5 rounded-xl  transition-all">
              <img src="icon/clip_black.svg" class="h-4" alt="add_link">
            </div> -->
          </div>
          
        </div>
        <textarea
        [placeholder]="isSearched() ? 'Ask Selected Paper' : 'Search Papers Using Keywords'"
        [ngModel]="text()"
        
        (ngModelChange)="onUserNameChange($event)" 
        class="shadow-xl border-black/[0.2] border bg-white h-20 rounded-xl font-light text-sm text-black/[0.5] p-3 resize-none focus:outline-none"
        type="text" ></textarea>
      </div>

      <span class="absolute right-3 bottom-3 flex size-3">
        <span 
        class="relative inline-flex size-2.5 rounded-full flicker bg-black/[0.2]"
        [ngClass]="{
          'bg-transparent':isTouched() === false,
          'bg-black/[0.1]': timeLeftToSend() > 2,
          'bg-black/[0.7]': timeLeftToSend() === 2,
          'bg-black flicker_faster': timeLeftToSend() === 1,
          'bg-white flicker_faster': timeLeftToSend() === 0
        }"></span>
      </span>
    </div>
  </div>
  <!-- ================================SEARCH LIST OF PAPERS: ENDS HERE=================================  -->

</div>
